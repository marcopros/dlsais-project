model_list:
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: gpt-3.5-turbo
      api_base: https://openrouter.ai/api/v1
      api_key: ${OPENAI_API_KEY}

  - model_name: gpt-4
    litellm_params:
      model: gpt-4
      api_base: https://openrouter.ai/api/v1
      api_key: ${OPENAI_API_KEY}

litellm_settings:
  # Imposta il timeout a 30 secondi
  request_timeout: 30

  # Aggiunge headers per OpenRouter
  extra_headers:
    {
      "HTTP-Referer": "https://dlsais-project.app",
      "X-Title": "DIY Home Diagnosis Agent",
    }

# Impostazioni generali
general_settings:
  # Porta su cui operare
  port: 8080
