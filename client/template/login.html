<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter :wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />

    <!-- Heroicons -->
    <script src="https://unpkg.com/heroicons @2.0.16/dist/outline.min.js"></script>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com "></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Manrope', 'sans-serif'],
            },
            colors: {
              primary: '#1E3A8A',
              accent: '#F97316',
            },
          },
          darkMode: 'class',
        },
      };
    </script>
  </head>
  <body class="bg-gradient-to-br from-blue-900 via-blue-700 to-orange-500 min-h-screen flex items-center justify-center font-sans">
    <div class="bg-white/10 backdrop-blur-lg p-8 rounded-3xl shadow-2xl w-full max-w-md text-white animate-fade-in">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-display font-extrabold">Welcome back</h1>
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v3m-3-6v6m3-9v6m9-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>

      <form id="loginForm" class="space-y-4">
        <div class="relative">
          <input type="email" id="email" name="email" placeholder="Email" required
            class="w-full pl-10 pr-4 py-3 rounded-full bg-white/20 text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-accent" />
          <svg class="absolute left-3 top-3.5 w-5 h-5 text-white/70" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 12H8m8 0H8m8-4H8m8 8H8m-2 4a2 2 0 01-2-2V6a2 2 0 012-2h12a2 2 0 012 2v12a2 2 0 01-2 2H6z" />
          </svg>
        </div>
        <div class="relative">
          <input type="password" id="password" name="password" placeholder="Password" required
            class="w-full pl-10 pr-4 py-3 rounded-full bg-white/20 text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-accent" />
          <svg class="absolute left-3 top-3.5 w-5 h-5 text-white/70" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c1.657 0 3-1.343 3-3S13.657 5 12 5s-3 1.343-3 3 1.343 3 3 3zm0 2c-2.21 0-4 1.79-4 4v2h8v-2c0-2.21-1.79-4-4-4z" />
          </svg>
        </div>

        <div class="flex items-center justify-between">
          <label class="inline-flex items-center">
            <input type="checkbox" class="rounded bg-white/20 border-white text-accent focus:ring-accent" />
            <span class="ml-2 text-sm">Remember me</span>
          </label>
          <a href="#" class="text-sm hover:underline text-white/80 hover:text-white">Forgot password?</a>
        </div>

        <button type="submit"
          class="w-full px-6 py-3 rounded-full bg-accent text-white font-semibold hover:bg-orange-400 transition">
          Sign In
        </button>
      </form>

      <p class="text-sm text-white/80 text-center mt-4">
        Don't have an account?
        <a href="/signup" class="underline hover:text-white">Sign up</a>
      </p>
    </div>

    <!-- JS Script -->
    <script src="../static/login.js"></script>
  </body>
</html>
