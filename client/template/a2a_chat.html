<!DOCTYPE html>
<html lang="en" class="scroll-smooth h-full overflow-x-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Repair Assistant Chat</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Manrope', 'sans-serif'],
          },
          colors: {
            primary: '#1E3A8A',
            accent: '#F97316',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: 0, transform: 'translateY(20px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
          },
          animation: {
            'fade-in': 'fadeIn 0.8s ease-out forwards',
          },
        },
      },
    };
  </script>
</head>
<body class="bg-gradient-to-br from-blue-900 via-blue-700 to-orange-500 text-white min-h-screen font-sans h-full overflow-x-hidden">
  <div class="flex h-screen w-full overflow-hidden">

    <!-- Sidebar for Appointments -->
    <div id="sidebar" class="fixed top-0 left-0 w-64 h-full z-50 transform -translate-x-full transition-transform duration-300 bg-gradient-to-br from-blue-800/80 via-blue-900/90 to-blue-950/90 backdrop-blur-md text-white border-r border-blue-800 shadow-xl">

    <div class="flex items-center justify-between px-4 py-3 border-b border-white/20">
        <h2 class="text-lg font-bold">Appointments</h2>
        <button id="close-sidebar" class="text-white hover:text-orange-300 text-2xl font-bold">&times;</button>
    </div>

    <div id="appointments-list" class="p-4 space-y-4 text-sm">
        <!-- Appointments injected here -->
    </div>
    </div>

    <!-- Mini Toggle Button Always Visible -->
    <button id="open-sidebar" class="fixed top-1/2 left-0 transform -translate-y-1/2 -translate-x-[2px] bg-accent hover:bg-orange-400 text-white w-10 h-10 rounded-r-full z-50 shadow-lg flex items-center justify-center text-xl font-bold transition">
    📅
    </button>

    <!-- Wrapper che si sposta con la sidebar -->
    <!-- Wrapper che si sposta con la sidebar -->
<div id="chat-wrapper" class="transition-all duration-300 lg:pl-64">
  <div id="chat-container" class="flex justify-center h-[calc(var(--vh,1vh)*100)] overflow-hidden">
    <div class="w-full max-w-3xl flex flex-col flex-grow bg-white/5 backdrop-blur-lg rounded-2xl overflow-hidden">

      <!-- Header -->
      <header class="p-6 border-b border-white/20 flex justify-between items-center">
        <div>
          <h1 class="text-3xl font-display font-extrabold text-white">Home Repair Assistant</h1>
          <p class="text-white/70 text-sm mt-1">Multi-agent system for all your home repair needs</p>
        </div>
      </header>

      <!-- Chat messages -->
      <div id="chat-messages" class="flex-1 overflow-y-auto px-6 py-4 space-y-4 text-white text-sm">
        <!-- Dynamic messages will appear here -->
      </div>

      <!-- Input -->
      <form id="chat-form" class="flex items-center gap-2 p-4 border-t border-white/10 bg-white/10 backdrop-blur-sm">
        <textarea
          id="user-input"
          rows="1"
          placeholder="Message the assistant..."
          class="flex-1 resize-none px-4 py-2 rounded-full bg-white/20 text-white placeholder-white/60 backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-accent"
          autocomplete="off"
        ></textarea>
        <button
          type="submit"
          class="p-3 rounded-full bg-white text-primary hover:bg-gray-100 transition"
        >
          <svg
            stroke="currentColor"
            fill="none"
            stroke-width="2"
            viewBox="0 0 24 24"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="w-5 h-5"
          >
            <path d="M22 2L11 13"></path>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>

    </div>
  </div>
</div>

  </div>

  <script src="../static/a2a_chat.js"></script>

</body>
</html>
