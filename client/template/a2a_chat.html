<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Repair Assistant</title>
    <link rel="stylesheet" href="../static/css/a2a_chat.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <header>
            <h1>Home Repair Assistant</h1>
            <p>Multi-agent system for all your home repair needs</p>
        </header>
        
        <div id="chat-messages" class="chat-messages"></div>
        
        <div class="chat-input">
            <form id="chat-form">
                <textarea id="user-input" rows="1" placeholder="Message the assistant..." autocomplete="off"></textarea>
                <button type="submit">
                    <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13"></path>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script src="../static/js/a2a_chat.js"></script>
</body>
</html>
